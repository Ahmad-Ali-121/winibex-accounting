name: winibex_accounting
description: Internal accounting system for Winibex PVT LTD.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

# Dependencies are added with `flutter pub add`, never pinned by hand, so the
# versions are whatever actually resolve together. Adding a package must still
# be noted in docs/DECISIONS.md.
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  # Turns app_en.arb into AppLocalizations on every build. See l10n.yaml.
  generate: true

  # Bundled, never fetched at runtime. Runtime fetching adds latency and is
  # blocked by the COEP header the Wasm build needs. Decision 028.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
